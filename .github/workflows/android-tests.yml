name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:allTests :app:shared:jvmTest :app:shared:testAndroidHostTest :server:test

  instrumented-tests:
    # Don't spend emulator minutes when the cheap host tests already fail.
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # ANDROID_HOME comes from the runner image, so it isn't visible to the `env` expression context.
      - run: echo "SDK_SYSTEM_IMAGES=$ANDROID_HOME/system-images" >> "$GITHUB_ENV"
      - name: Cache managed devices
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ env.SDK_SYSTEM_IMAGES }}
          key: gmd-${{ runner.os }}-${{ hashFiles('app/androidApp/build.gradle.kts') }}
      # No sharding: the ci group already boots two emulators, which is all a 4-vCPU runner handles reliably.
      - name: Run managed device tests
        run: >
          ./gradlew :app:androidApp:ciGroupDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: |
            app/androidApp/build/outputs/androidTest-results
            app/androidApp/build/reports/androidTests
