name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Skip the device cache, to test device setup from scratch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check, so it always runs and detects changes itself. A path-filtered workflow never
  # reports, which leaves the pull request stuck, and a job skipped because a separate detection job
  # failed counts as passed. Here a failed detection fails this job.
  host-tests:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is the base branch.
          fetch-depth: 2
      # Only pull requests can skip. Every run on main is full: a newer run cancels an older one, so
      # a docs merge must not replace the tests of the code merge before it.
      - name: Detect docs-only pull requests
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # Without --no-renames, moving code into docs/ would list only the docs path.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "$changed"
          if ! grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$changed"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            # A green check with no tests behind it should say so.
            printf 'Docs-only pull request, so tests were skipped. Changed files:\n\n```\n%s\n```\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code != 'false'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.code != 'false'
      - if: steps.changes.outputs.code != 'false'
        run: ./gradlew :core:allTests :app:shared:jvmTest :app:shared:testAndroidHostTest :server:test
      # Desktop renders from the Compose UI tests, for reviewing UI changes.
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.code != 'false'
        with:
          name: desktop-screenshots
          path: app/shared/build/screenshots
          if-no-files-found: warn

  instrumented-tests:
    # Don't spend emulator minutes when the cheap host tests already fail.
    needs: host-tests
    if: needs.host-tests.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # ANDROID_HOME comes from the runner image, so it isn't visible to the `env` expression context.
      - run: echo "SDK_SYSTEM_IMAGES=$ANDROID_HOME/system-images" >> "$GITHUB_ENV"
      # The runner's SDK doesn't pre-accept the license that covers the ATD system images GMD downloads.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Cache managed devices
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ env.SDK_SYSTEM_IMAGES }}
          key: gmd-${{ runner.os }}-${{ hashFiles('app/androidApp/build.gradle.kts') }}
      # Install before Gradle, which fails on a cache hit (the cache has no emulator) and can break the
      # SDK on a miss (both setup tasks install the emulator at once). Match the managedDevices images.
      - name: Install emulator and system images
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          emulator "system-images;android-30;aosp_atd;x86" "system-images;android-34;aosp_atd;x86_64"
      # No sharding: the ci group already boots two emulators, which is all a 4-vCPU runner handles reliably.
      - name: Run managed device tests
        run: >
          ./gradlew :app:androidApp:ciGroupDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: |
            app/androidApp/build/outputs/androidTest-results
            app/androidApp/build/reports/androidTests
      # Screenshots the tests saved on each managed device through the test storage service.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-screenshots
          path: app/androidApp/build/outputs/managed_device_android_test_additional_output
          if-no-files-found: warn
