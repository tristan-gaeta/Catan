<rect x='205.0' y='242.0' width='50' height='50' rx='6' fill='#f5f1e6' stroke='#9aa5b1' />
<text x='230.0' y='259.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >N</text>
<text x='230.0' y='277.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[14]</text>
<rect x='259.0' y='242.0' width='50' height='50' rx='6' fill='#f5f1e6' stroke='#9aa5b1' />
<text x='284.0' y='259.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >O</text>
<text x='284.0' y='277.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[15]</text>
<rect x='313.0' y='242.0' width='50' height='50' rx='6' fill='#f5f1e6' stroke='#9aa5b1' />
<text x='338.0' y='259.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >P</text>
<text x='338.0' y='277.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[16]</text>
<rect x='367.0' y='242.0' width='50' height='50' rx='6' fill='#eef0f2' stroke='#9aa5b1' stroke-dasharray='4 3'/>
<text x='392.0' y='259.0' font-size='10' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >null</text>
<text x='392.0' y='277.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[17]</text>
<rect x='178.0' y='296.0' width='50' height='50' rx='6' fill='#f5f1e6' stroke='#9aa5b1' />
<text x='203.0' y='313.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >Q</text>
<text x='203.0' y='331.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[18]</text>
<rect x='232.0' y='296.0' width='50' height='50' rx='6' fill='#f5f1e6' stroke='#9aa5b1' />
<text x='257.0' y='313.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >R</text>
<text x='257.0' y='331.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[19]</text>
<rect x='286.0' y='296.0' width='50' height='50' rx='6' fill='#f5f1e6' stroke='#9aa5b1' />
<text x='311.0' y='313.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >S</text>
<text x='311.0' y='331.0' font-size='10' fill='#c2410c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >[20]</text>
<rect x='340.0' y='296.0' width='50' height='50' rx='6' fill='#ffffff' stroke='#9aa5b1' stroke-dasharray='2 4'/>
<text x='365.0' y='313.0' font-size='10' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >trimmed</text>
<rect x='394.0' y='296.0' width='50' height='50' rx='6' fill='#ffffff' stroke='#9aa5b1' stroke-dasharray='2 4'/>
<text x='419.0' y='313.0' font-size='10' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >trimmed</text>
<text x='470.0' y='90.0' font-size='12' fill='#1f2933' font-weight='bold' text-anchor='start' dominant-baseline='central' >index = 5 (r + 2) + q</text>
<text x='470.0' y='109.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' ></text>
<text x='470.0' y='128.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >Rows are r, columns are q, each row shifted half a cell</text>
<text x='470.0' y='147.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >so the rhombus lines up with the hexagon.</text>
<text x='470.0' y='166.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' ></text>
<text x='470.0' y='185.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >The cells before A and after S are never needed,</text>
<text x='470.0' y='204.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >so the array starts 2 cells late: 21 slots, not 25.</text>
<text x='470.0' y='223.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >The two in-range corners hold null.</text>
<text x='470.0' y='242.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' ></text>
<text x='470.0' y='261.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >Vertex.board and Edge.board use the same trick on a</text>
<text x='470.0' y='280.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >7 × 7 grid (radius 3), so sea cells around the island</text>
<text x='470.0' y='299.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >can own the coastal corners and sides.</text>
</svg>
