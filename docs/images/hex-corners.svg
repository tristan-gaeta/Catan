<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 460' width='1000' height='460' font-family='Helvetica, Arial, sans-serif'>
<title>Corner and side names on one hex</title>
<rect width='100%' height='100%' fill='#ffffff'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<polygon points='300.0,80.0 170.1,155.0 170.1,305.0 300.0,380.0 429.9,305.0 429.9,155.0' fill='#f5f1e6' stroke='#1f2933' stroke-width='2'/>
<text x='300.0' y='218.0' font-size='16' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >hex (q, r)</text>
<text x='300.0' y='242.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >hex.vertices[d] · hex.edges[d]</text>
<circle cx='300.0' cy='80.0' r='7' fill='#c2410c'/>
<text x='300.0' y='54.0' font-size='13' fill='#c2410c' font-weight='bold' text-anchor='middle' dominant-baseline='central' >corner NE</text>
<text x='352.0' y='140.0' font-size='13' fill='#1d4ed8' font-weight='bold' text-anchor='middle' dominant-baseline='central' >side NE</text>
<circle cx='170.1' cy='155.0' r='7' fill='#c2410c'/>
<text x='144.1' y='142.0' font-size='13' fill='#c2410c' font-weight='bold' text-anchor='middle' dominant-baseline='central' >corner NW</text>
<text x='248.0' y='140.0' font-size='13' fill='#1d4ed8' font-weight='bold' text-anchor='middle' dominant-baseline='central' >side NW</text>
<circle cx='170.1' cy='305.0' r='7' fill='#c2410c'/>
<text x='144.1' y='318.0' font-size='13' fill='#c2410c' font-weight='bold' text-anchor='middle' dominant-baseline='central' >corner W</text>
<text x='196.1' y='230.0' font-size='13' fill='#1d4ed8' font-weight='bold' text-anchor='middle' dominant-baseline='central' >side W</text>
<circle cx='300.0' cy='380.0' r='7' fill='#c2410c'/>
<text x='300.0' y='406.0' font-size='13' fill='#c2410c' font-weight='bold' text-anchor='middle' dominant-baseline='central' >corner SW</text>
<text x='248.0' y='320.0' font-size='13' fill='#1d4ed8' font-weight='bold' text-anchor='middle' dominant-baseline='central' >side SW</text>
<circle cx='429.9' cy='305.0' r='7' fill='#c2410c'/>
<text x='455.9' y='318.0' font-size='13' fill='#c2410c' font-weight='bold' text-anchor='middle' dominant-baseline='central' >corner SE</text>
<text x='352.0' y='320.0' font-size='13' fill='#1d4ed8' font-weight='bold' text-anchor='middle' dominant-baseline='central' >side SE</text>
<circle cx='429.9' cy='155.0' r='7' fill='#c2410c'/>
<text x='455.9' y='142.0' font-size='13' fill='#c2410c' font-weight='bold' text-anchor='middle' dominant-baseline='central' >corner E</text>
<text x='403.9' y='230.0' font-size='13' fill='#1d4ed8' font-weight='bold' text-anchor='middle' dominant-baseline='central' >side E</text>
<text x='520.0' y='120.0' font-size='13' fill='#1f2933' font-weight='normal' text-anchor='start' dominant-baseline='central' >Side d is the edge shared with the neighbor in direction d.</text>
<text x='520.0' y='140.0' font-size='13' fill='#1f2933' font-weight='normal' text-anchor='start' dominant-baseline='central' >Corner d sits 30° counter-clockwise of side d,</text>
<text x='520.0' y='160.0' font-size='13' fill='#1f2933' font-weight='normal' text-anchor='start' dominant-baseline='central' >so side d runs from corner d to corner d − 1:</text>
<text x='520.0' y='180.0' font-size='13' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >side NE joins corners NE and E.</text>
<text x='520.0' y='200.0' font-size='13' fill='#1f2933' font-weight='normal' text-anchor='start' dominant-baseline='central' ></text>
<text x='520.0' y='220.0' font-size='13' fill='#1f2933' font-weight='normal' text-anchor='start' dominant-baseline='central' >Corner NE is the north point and corner SW the south.</text>
<text x='520.0' y='240.0' font-size='13' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >Each vertex is stored once, as the north or south</text>
<text x='520.0' y='260.0' font-size='13' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >corner of one cell (Vertex.fromCoordinates);</text>
<text x='520.0' y='280.0' font-size='13' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >each edge as the NE, NW or W side of one cell</text>
<text x='520.0' y='300.0' font-size='13' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >(Edge.fromCoordinate).</text>
</svg>
