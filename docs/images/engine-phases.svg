<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1060 660' width='1060' height='660' font-family='Helvetica, Arial, sans-serif'>
<title>Engine phases</title>
<rect width='100%' height='100%' fill='#ffffff'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<rect x='40' y='60' width='230' height='62' rx='10' fill='#eff6ff' stroke='#1f2933' stroke-width='1.4' />
<text x='155.0' y='82.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >RollForFirstPlayer</text>
<text x='155.0' y='103.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >ties roll again</text>
<rect x='40' y='210' width='230' height='62' rx='10' fill='#eff6ff' stroke='#1f2933' stroke-width='1.4' />
<text x='155.0' y='232.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >SetupSettlement(round)</text>
<text x='155.0' y='253.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >snake order; round 2 pays out</text>
<rect x='40' y='360' width='230' height='62' rx='10' fill='#eff6ff' stroke='#1f2933' stroke-width='1.4' />
<text x='155.0' y='382.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >SetupRoad(round, v)</text>
<text x='155.0' y='403.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >a road touching settlement v</text>
<rect x='420' y='60' width='230' height='62' rx='10' fill='#f5f1e6' stroke='#1f2933' stroke-width='1.4' />
<text x='535.0' y='82.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >PreRoll</text>
<text x='535.0' y='103.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >roll, or play a card first</text>
<rect x='420' y='360' width='230' height='62' rx='10' fill='#f5f1e6' stroke='#1f2933' stroke-width='1.4' />
<text x='535.0' y='382.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >Main</text>
<text x='535.0' y='403.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >trade and build in any order</text>
<rect x='420' y='520' width='230' height='62' rx='10' fill='#f5f1e6' stroke='#1f2933' stroke-width='1.4' />
<text x='535.0' y='542.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >RoadBuilding(n, returnTo)</text>
<text x='535.0' y='563.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >up to 2 free roads</text>
<rect x='790' y='210' width='230' height='62' rx='10' fill='#f5f1e6' stroke='#1f2933' stroke-width='1.4' />
<text x='905.0' y='232.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >Discard(pending)</text>
<text x='905.0' y='253.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >everyone over 7 cards</text>
<rect x='790' y='360' width='230' height='62' rx='10' fill='#f5f1e6' stroke='#1f2933' stroke-width='1.4' />
<text x='905.0' y='382.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >MoveRobber(returnTo)</text>
<text x='905.0' y='403.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >then rob a neighbor</text>
<rect x='790' y='520' width='230' height='62' rx='10' fill='#fff7ed' stroke='#1f2933' stroke-width='1.4' stroke-dasharray='5 4'/>
<text x='905.0' y='542.0' font-size='14' fill='#1f2933' font-weight='bold' text-anchor='middle' dominant-baseline='central' >GameOver(winner)</text>
<text x='905.0' y='563.0' font-size='11' fill='#616e7c' font-weight='normal' text-anchor='middle' dominant-baseline='central' >no actions accepted</text>
<path d='M155,122 L155,210' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='163.0' y='166.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>highest roll goes first</text>
<path d='M120,272 L120,360' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='112.0' y='285.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='end' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>PlaceSettlement</text>
<path d='M190,360 L190,272' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='198.0' y='285.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>PlaceRoad: next player</text>
<path d='M270,391 L330,391 L330,91 L420,91' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='340.0' y='150.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>after the last PlaceRoad</text>
<path d='M500,122 L500,360' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='492.0' y='240.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='end' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>RollDice, not 7</text>
<path d='M570,360 L570,122' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='578.0' y='240.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>EndTurn: next player</text>
<path d='M650,91 L905,91 L905,210' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='780.0' y='78.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='middle' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>RollDice 7, someone over 7</text>
<path d='M650,116 L810,360' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='694.0' y='168.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>7, no one over 7</text>
<text x='694.0' y='184.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' >or PlayKnight</text>
<path d='M905,272 L905,360' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='915.0' y='316.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>last Discard</text>
<path d='M650,376 L790,376' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='720.0' y='362.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='middle' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>PlayKnight</text>
<path d='M790,406 L650,406' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='720.0' y='420.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='middle' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>MoveRobber</text>
<path d='M500,422 L500,520' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='492.0' y='451.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='end' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>PlayRoadBuilding</text>
<path d='M570,520 L570,422' fill='none' stroke='#1f2933' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='578.0' y='451.0' font-size='11' fill='#1d4ed8' font-weight='normal' text-anchor='start' dominant-baseline='central' paint-order='stroke' stroke='white' stroke-width='4'>last free road</text>
<text x='40.0' y='618.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >MoveRobber and RoadBuilding resume at returnTo: Main, or PreRoll when the card was played before the roll.</text>
<text x='40.0' y='637.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >GameOver follows any accepted action after set-up that leaves the current player with 10 points.</text>
</svg>
