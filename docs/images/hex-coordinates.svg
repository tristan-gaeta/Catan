<text x='630.0' y='340.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >Pointy-top hexes in axial (q, r) coordinates.</text>
<text x='630.0' y='358.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >The third cube coordinate s = −q − r is implied.</text>
<text x='630.0' y='376.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' ></text>
<text x='630.0' y='394.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >Hex ordinals are reading order: A is</text>
<text x='630.0' y='412.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >the top-left tile, S the bottom-right.</text>
<text x='630.0' y='430.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' ></text>
<text x='630.0' y='448.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >Direction ordinals run counter-clockwise</text>
<text x='630.0' y='466.0' font-size='12' fill='#616e7c' font-weight='normal' text-anchor='start' dominant-baseline='central' >from NE, so opposite = (ordinal + 3) mod 6.</text>
